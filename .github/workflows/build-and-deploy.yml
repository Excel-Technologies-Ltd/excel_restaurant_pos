name: Build and Push Arc POS

on:
  push:
    branches:
      - arc-pos
  workflow_dispatch:
    inputs:
      branch:
        description: "excel_restaurant_pos / Excel-ERPNext branch to build"
        required: true
        default: "arc-pos"
        type: string

# A newer push cancels an older build still running for the same branch
concurrency:
  group: arc-pos-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: registry.aninda.me
  IMAGE: registry.aninda.me/bancan/arc-pos
  BASE_REGISTRY: registry.aninda.me/dockerhub/library
  APP_BRANCH: ${{ inputs.branch || 'arc-pos' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Build files live in this repo under docker/ (Containerfile + nginx resources)
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        id: build
        run: |
          APPS_JSON='[
            { "url": "https://github.com/frappe/erpnext", "branch": "version-14" },
            { "url": "https://github.com/frappe/hrms.git", "branch": "version-14" },
            { "url": "https://github.com/Excel-Technologies-Ltd/excel_restaurant_pos.git",
              "branch": "${{ env.APP_BRANCH }}" },
            { "url": "https://github.com/Excel-Technologies-Ltd/Excel-ERPNext.git",
              "branch": "${{ env.APP_BRANCH }}" },
            { "url": "https://github.com/Excel-Technologies-Ltd/uber-direct.git", "branch": "main" }
          ]'
          APPS_JSON_BASE64=$(echo -n "$APPS_JSON" | base64 -w 0)

          # Unique, rollback-able tag: <branch>-<short-sha>, e.g. arc-pos-3f9c2a1
          SAFE_BRANCH=${APP_BRANCH//\//-}
          TAG="${SAFE_BRANCH}-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # APPS_JSON is identical between runs, so the builder stage (bench init)
          # must skip the cache or it would ship stale app code.
          # Only the base stage (system deps, Python, Node) comes from the cache.
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_REGISTRY="$BASE_REGISTRY" \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg FRAPPE_BRANCH=version-14 \
            --build-arg PYTHON_VERSION=3.11.9 \
            --build-arg NODE_VERSION=20.19.2 \
            --build-arg APPS_JSON_BASE64="$APPS_JSON_BASE64" \
            --no-cache-filter builder \
            --cache-from type=registry,ref=$IMAGE:buildcache \
            --cache-to type=registry,ref=$IMAGE:buildcache,mode=max \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            --file docker/Containerfile \
            --push docker

      - name: Summary
        run: |
          echo "### Pushed to Harbor" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:${{ steps.build.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"

